name: Publish profile bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic profile bundle version
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Package archive and manifest
        run: node scripts/package-release.mjs "${{ inputs.version }}"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "profiles-v${{ inputs.version }}"
          dist/profiles.zip dist/profiles-manifest.json
          --title "Printer profiles ${{ inputs.version }}"
          --notes "Validated MakerSync printer profile bundle ${{ inputs.version }}."

